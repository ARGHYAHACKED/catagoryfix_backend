services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogfix
      POSTGRES_PASSWORD: catalogfix
      POSTGRES_DB: catalogfix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogfix -d catalogfix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: catalogfix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: catalogfix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: catalogfix-minio-init
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./infrastructure/docker/minio-cors.json:/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio miniosecret;
      mc mb -p local/catalogfix || true;
      mc cors set local/catalogfix /cors.json || true;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
