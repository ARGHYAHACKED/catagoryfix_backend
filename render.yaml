# Render Blueprint configuration for CatalogFix
# See https://render.com/docs/blueprint-spec for format details

services:
  # 1. NestJS REST API Server
  - type: web
    name: catalogfix-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @catalogfix/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: WEB_URL
        value: https://catalogfix.in
      - key: API_URL
        value: https://api.catalogfix.in
      - key: COOKIE_DOMAIN
        value: .catalogfix.in
      - key: COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: catalogfix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: catalogfix-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PASSWORD_PEPPER
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # 2. BullMQ Background Worker Process
  - type: worker
    name: catalogfix-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @catalogfix/worker build
    startCommand: node apps/worker/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: catalogfix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: catalogfix-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PASSWORD_PEPPER
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # 3. Redis Instance for Job Queues
  - type: redis
    name: catalogfix-redis
    plan: starter
    maxmemoryPolicy: noeviction

# 4. PostgreSQL Database
databases:
  - name: catalogfix-db
    databaseName: catalogfix
    user: catalogfix
    plan: starter
